name: "idownloadd: build and upload"

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4
        with:
            submodules: recursive

      - name: Install Procursus Toolchain
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Setup Environment Variables
        run: |
          set -x
          T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=${T2}" >> $GITHUB_ENV
          echo "shorthash=${SHASH}" >> $GITHUB_ENV

      - name: Build trustcache Dependency
        run: |
          set -x
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          
          # 1. Map out the exact OpenSSL include path
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          
          # 2. Fix missing flat header by symlinking sha.h into the root directory
          ln -s "${OPENSSL_PREFIX}/include/openssl/sha.h" ./sha.h
          
          # 3. Export global path variables that 'cc' respects automatically
          export C_INCLUDE_PATH="${OPENSSL_PREFIX}/include:$(pwd)"
          export LIBRARY_PATH="${OPENSSL_PREFIX}/lib"
          
          # 4. Compile cleanly
          make -j$(sysctl -n hw.logicalcpu)
          sudo cp trustcache /usr/local/bin/

      - name: Build idownloadd Binary
        run: |
          set -x
          make build

      - name: Upload Artifact
        id: idownloadd-latest-upload
        uses: actions/upload-artifact@v4
        with:
          name: idownloadd-${{ env.shorthash }}
          path: |
            ${{ github.workspace }}/idownloadd
