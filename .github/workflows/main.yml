name: "idownloadd: build and upload"

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4
        with:
            submodules: recursive

      - name: Install Procursus Toolchain
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Setup Environment Variables
        run: |
          set -x
          T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=${T2}" >> $GITHUB_ENV
          echo "shorthash=${SHASH}" >> $GITHUB_ENV

      - name: Build trustcache Dependency
        run: |
          set -x
          # Install OpenSSL dependency to get sha.h headers
          brew install openssl@3
          
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          
          # Inject Homebrew OpenSSL header paths into compiler flags
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl@3)/include"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl@3)/lib"
          
          make -j$(sysctl -n hw.logicalcpu)
          sudo cp trustcache /usr/local/bin/

      - name: Build idownloadd Binary
        run: |
          set -x
          make build

      - name: Upload Artifact
        id: idownloadd-latest-upload
        uses: actions/upload-artifact@v4
        with:
          name: idownloadd-${{ env.shorthash }}
          path: |
            ${{ github.workspace }}/idownloadd
